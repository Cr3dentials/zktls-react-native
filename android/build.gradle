buildscript {
  ext.ZktlsReactNative = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ZktlsReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.zktlsreactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The native zkTLS SDK. Local-binary-first: build the AAR from the zktls-sdk
  // repo (android/build-rust.sh, then :sdk:assembleRelease) and drop it at
  // android/libs/zktls-sdk.aar. Switch to the published coordinate once it
  // exists: implementation("io.github.cr3dentials:zktls-sdk:1.0.0")
  implementation fileTree(dir: "libs", include: ["*.aar"])
  // A file/flatDir AAR does not carry its own transitive deps, so declare the
  // ones the SDK brings (see the SDK's integration-android.md).
  implementation "net.java.dev.jna:jna:5.14.0@aar"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
