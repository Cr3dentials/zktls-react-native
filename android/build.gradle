buildscript {
  ext.ZktlsReactNative = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ZktlsReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.zktlsreactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
  // Local-first: the SDK is resolved from the local Maven cache until it is
  // published to Maven Central.
  mavenLocal()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The native zkTLS SDK. Resolved from Maven; its POM brings the transitive
  // deps (JNA, coroutines). Local-binary-first: publish the AAR to the local
  // Maven cache (:sdk:publishReleasePublicationToMavenLocal in the zktls-sdk
  // repo) until it is published to Maven Central.
  implementation "io.github.cr3dentials:zktls-sdk:0.1.0"
}
